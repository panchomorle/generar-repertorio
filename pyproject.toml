[project]
name = "generar-repertorio"
version = "1.1.0"
description = "Generador de cancionero / repertorio en Word (.docx) desde Cifra Club"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.1.0",
    "customtkinter>=5.2.0",
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.5.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
