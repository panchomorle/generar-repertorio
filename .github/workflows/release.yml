name: Release Windows Executable

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest

      - name: Build Windows .exe with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --paths src --name "GeneradorRepertorio" --collect-all customtkinter --hidden-import docx --hidden-import bs4 main.py

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist\GeneradorRepertorio.exe")) {
            throw "Executable dist\GeneradorRepertorio.exe was not created!"
          }

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/GeneradorRepertorio.exe
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
